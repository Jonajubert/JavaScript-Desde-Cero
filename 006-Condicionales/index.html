<!DOCTYPE html>
<!-- Indica al navegador que utilizamos HTML5 -->

<html lang="es">

<head>

    <!-- Permite mostrar correctamente caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Adapta la página a celulares y tablets -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Condicionales en JavaScript</title>

    <!--
        Conectamos nuestro archivo JavaScript.

        defer permite descargar el archivo mientras
        se procesa el HTML y ejecutarlo después
        de que el documento haya sido analizado.
    -->
    <script src="script.js" defer></script>

</head>

<body>

    <header>

        <h1>JavaScript Desde Cero</h1>

        <p>
            Aprendiendo estructuras condicionales.
        </p>

    </header>


    <main>

        <section>

            <h2>Condicionales</h2>

            <p>
                Abrí la consola del navegador para
                observar el resultado del programa.
            </p>

        </section>

    </main>


    <footer>

        <p>Creado por Jonatan Jubert</p>

    </footer>

</body>

</html>
